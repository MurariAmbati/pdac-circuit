<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="nav-links">
      {% for item in site.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
      <li><a href="https://github.com/{{ site.repository }}">Code</a></li>
    </ul>
  </div>
</nav>
