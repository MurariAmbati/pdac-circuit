[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdac-circuit"
version = "0.1.0"
description = "PDAC synthetic gene-circuit design pipeline (Research Use Only). Real-data-only, every tool built from scratch."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "LicenseRef-Proprietary-RUO" }
authors = [{ name = "AURORA-NEURO" }]
# base: generic numerics + IO only. NO domain-algorithm libraries (RNA folding,
# splice scoring, off-target, Pareto, MCDA are all implemented from scratch).
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "networkx>=3.0",
  "requests>=2.30",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# torch is inherited from the system site-packages (2.11.0+cu128, sm_120). Pinned
# here only as a reproducibility record; do not reinstall (risks losing the sm_120 cubin).
torch = ["torch>=2.11"]
bio = ["biopython>=1.83", "pyfaidx>=0.8", "pyarrow>=14"]
chromatin = [
  "pyBigWig>=0.3.24; platform_system != 'Windows'",
  "pybigtools>=0.3.0; platform_system == 'Windows'",
]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
pdac = "pdac_circuit.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "real_data: requires datasets downloaded under data/raw (deselect with -m 'not real_data')",
  "slow: long-running (training / convergence) tests",
  "gpu: requires CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py312"
